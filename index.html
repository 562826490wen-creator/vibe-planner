    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            color: #1a202c;
            margin: 0;
            padding: 0;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), 0 5px 15px rgba(0, 0, 0, 0.03);
            transition: max-width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-transition {
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s ease-out;
        }

        .fade-transition.show {
            opacity: 1;
            transform: translateY(0);
        }

        .option-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.7);
        }

        .option-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border-color: #6366f1;
            /* Indigo 500 */
            background: rgba(255, 255, 255, 0.95);
        }

        .option-card:active {
            transform: translateY(0);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* Language Toggle Switch */
        .lang-switch {
            position: relative;
            display: inline-flex;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 9999px;
            padding: 4px;
        }

        .lang-switch button {
            position: relative;
            z-index: 10;
            transition: color 0.3s;
        }

        .lang-switch .active-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: white;
            border-radius: 9999px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-switch[data-lang="ko"] .active-bg {
            transform: translateX(100%);
        }

        /* Gradient Text */
        .text-gradient {
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-bar-fill {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Leaflet popups */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .leaflet-popup-content {
            font-family: inherit;
            margin: 12px;
        }

        .leaflet-container a.leaflet-popup-close-button {
            top: 10px;
            right: 10px;
            color: #9CA3AF;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-6px);
            }
        }

                        taobaoUrl: "https://s.taobao.com/search?q=韩国旅游eSIM+上网卡+高速5G",
                        amazonUrl: "https://www.amazon.com/s?k=korea+esim+travel",
                        image: "https://images.unsplash.com/photo-1562408590-e32931084e23?auto=format&fit=crop&w=400&q=80"
                    }
                ]
            }
        };

        // --- STATE ---
        let lang = 'zh'; // 'zh' or 'ko'
        let state = 'landing'; // 'landing', 'quiz', 'result'
        let currentQuestion = 0;
        let answers = []; // Stores selected letters (A-F)
        let finalResultId = null;

        // Map variables
        let itineraryMap = null;
        let markersMap = {};
        let isFirstMapLoad = true;

        const appContent = document.getElementById('app-content');

        // --- LOGIC ---
        function setLanguage(newLang) {
            lang = newLang;

            // Update Toggle Switch UI
            document.getElementById('lang-switch-container').setAttribute('data-lang', lang);

            if (lang === 'zh') {
                document.getElementById('btn-lang-zh').classList.replace('text-gray-500', 'text-indigo-600');
                document.getElementById('btn-lang-ko').classList.replace('text-indigo-600', 'text-gray-500');
                document.documentElement.lang = 'zh';
            } else {
                document.getElementById('btn-lang-ko').classList.replace('text-gray-500', 'text-indigo-600');
                document.getElementById('btn-lang-zh').classList.replace('text-indigo-600', 'text-gray-500');
                document.documentElement.lang = 'ko';
            }

            // Re-render current view dynamically
            renderCurrentState(false);
        }

        function triggerFade(callback) {
            appContent.classList.remove('show');
            setTimeout(() => {
                callback();
                setTimeout(() => {
                    appContent.classList.add('show');
                }, 50);
            }, 300);
        }

        function renderCurrentState(animate = true) {
            const render = () => {
                if (state === 'landing') renderLanding();
                else if (state === 'quiz') renderQuiz();
                else if (state === 'result') renderResult();
            };

            if (animate) {
                triggerFade(render);
            } else {
                render();
            }
        }

        function startQuiz() {
            state = 'quiz';
            currentQuestion = 0;
            answers = [];
            isFirstMapLoad = true;
            renderCurrentState(true);
        }

        function selectOption(optionId) {
            answers.push(optionId);
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderCurrentState(true);
            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            const counts = {};
            answers.forEach(val => {
                counts[val] = (counts[val] || 0) + 1;
            });
            let maxCount = 0;
            let resultId = 'A'; // default
            for (const [id, count] of Object.entries(counts)) {
                if (count > maxCount) {
                    maxCount = count;
                    resultId = id;
                }
            }
            finalResultId = resultId;
            state = 'result';
            renderCurrentState(true);
        }

        function restartQuiz() {
            state = 'landing';
            const container = document.getElementById('travel-quiz-container');
            container.classList.remove('max-w-4xl');
            container.classList.add('max-w-2xl');
            isFirstMapLoad = true;
            renderCurrentState(true);
        }

        // --- RENDER FUNCTIONS ---
        function renderLanding() {
            const landingTitleStr = i18n.landingTitle[lang];
            const landingDescStr = i18n.landingDesc[lang];
            const startBtnStr = i18n.startBtn[lang];

            appContent.innerHTML = `
                <div class="flex-1 flex flex-col justify-center items-center text-center max-w-md mx-auto py-10">
                    <div class="text-7xl mb-6 transform hover:scale-110 transition-transform duration-300">🧭</div>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 leading-tight">
                        ${landingTitleStr}
                    </h1>
                    <p class="text-gray-600 text-lg mb-10 leading-relaxed font-medium">
                        ${landingDescStr}
                    </p>
                    <button onclick="startQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 rounded-full shadow-lg shadow-indigo-200 transform hover:-translate-y-1 transition-all duration-300 w-full md:w-auto text-lg">
                        ${startBtnStr}
                    </button>
                </div>
            `;
        }

        function renderQuiz() {
            const qData = questions[currentQuestion];
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            const currentQText = qData.q[lang];

            let optionsHtml = '';
            qData.options.forEach(opt => {
                const optText = opt[lang];
                optionsHtml += `
                <button onclick="selectOption('${opt.id}')" class="option-card w-full text-left p-4 md:p-5 rounded-2xl flex items-center gap-4 group cursor-pointer shadow-sm">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-lg group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300">
                        ${opt.id}
                    </div>
                    <span class="text-gray-700 font-semibold group-hover:text-gray-900 text-base md:text-lg transition-colors duration-300">
                        ${optText}
                    </span>
                </button>
                `;
            });

            appContent.innerHTML = `
                <div class="w-full flex-1 flex flex-col pt-2">
                    <div class="mb-8">
                        <div class="flex justify-between text-sm font-bold text-gray-500 mb-2">
                            <span>Q${currentQuestion + 1}</span>
                            <span>${currentQuestion + 1} / ${questions.length}</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-2.5 rounded-full progress-bar-fill" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>
                    
                    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-8 leading-snug">
                        ${currentQText}
                    </h2>
                    
                    <div class="space-y-3 flex-1 pb-4">
                        ${optionsHtml}
                    </div>
                </div>
            `;

            setTimeout(() => {
                const fill = document.querySelector('.progress-bar-fill');
                if (fill) {
                    fill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
                }
            }, 50);
        }

        function renderResult() {
            const resData = resultsData[finalResultId];
            const container = document.getElementById('travel-quiz-container');

            // 动态扩展容器以容纳地图
            container.classList.remove('max-w-2xl');
            container.classList.add('max-w-4xl');

            const matchResultStr = i18n.matchResult[lang];
            const destNameStr = resData.dest[lang];
            const destImgUrl = resData.image;
            const transitionTextStr = i18n.transitionText[lang];
            const recommendedProductsStr = i18n.recommendedProducts[lang];
            const calloutStr = i18n.callout[lang];
            const retakeBtnStr = i18n.retakeBtn[lang];
            const taobaoBtnStr = i18n.taobaoBtn[lang];
            const amazonBtnStr = i18n.amazonBtn[lang];

            // Unify itinerary container for all 6 destinations
            const itineraryHtml = `
                <div class="mt-10 bg-white rounded-2xl overflow-hidden shadow-lg border border-gray-200 fade-transition show">
                    <div class="p-4 bg-indigo-600 text-white font-bold flex justify-between items-center">
                        <span>📍 ${lang === 'zh' ? '专属行程地图 (Vibe Planner)' : '전용 일정 지도 (Vibe Planner)'}</span>
                        <span class="text-[11px] bg-white text-indigo-600 px-2.5 py-1 rounded-full uppercase tracking-widest font-black">Powered by Vibe Planner</span>
                    </div>
                    <div class="flex flex-col md:flex-row h-[500px]">
                        <!-- Left: Map -->
                        <div class="w-full md:w-[60%] h-[250px] md:h-full relative z-0" id="itinerary-map"></div>
                        <!-- Right: List -->
                        <div class="w-full md:w-[40%] h-[250px] md:h-full overflow-y-auto p-4 space-y-4 bg-gray-50 border-l border-gray-100" id="itinerary-list">
                            <!-- JS will populate -->
                        </div>
                    </div>
                </div>
            `;

            let productsHtml = '';
            resData.products.forEach(prod => {
                const prodName = prod.name[lang];
                const prodDesc = prod.desc[lang];
                productsHtml += `
                <div class="bg-white/90 backdrop-blur-md border border-white/60 rounded-2xl p-4 md:p-5 flex flex-col md:flex-row gap-5 shadow-sm hover:shadow-xl transition-shadow duration-300">
                    <div class="w-full md:w-36 h-36 rounded-xl overflow-hidden flex-shrink-0 bg-gray-100 border border-gray-100">
                        <img src="${prod.image}" alt="Product" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 flex flex-col justify-between">
                        <div>
                            <h4 class="font-extrabold text-lg text-gray-900 mb-1.5">${prodName}</h4>
                            <p class="text-sm font-medium text-gray-500 mb-4">${prodDesc}</p>
                        </div>
                        <div class="flex gap-2.5 mt-auto">
                            <!-- Direct link with target=_blank -->
                            <a href="${prod.taobaoUrl}" target="_blank" class="flex-1 bg-gradient-to-r from-[#ff5000] to-[#ff7e00] hover:from-[#e64800] hover:to-[#ff5000] text-white text-center py-2.5 rounded-xl font-bold text-sm transition-all shadow-md transform hover:-translate-y-0.5 flex items-center justify-center gap-1">
                                🛒 ${taobaoBtnStr}
                            </a>
                            <a href="${prod.amazonUrl}" target="_blank" class="flex-1 bg-gradient-to-r from-[#232f3e] to-[#37475A] hover:from-[#131a22] hover:to-[#232f3e] text-white text-center py-2.5 rounded-xl font-bold text-sm transition-all shadow-md transform hover:-translate-y-0.5 flex items-center justify-center gap-1">
                                📦 ${amazonBtnStr}
                            </a>
                        </div>
                    </div>
                </div>
                `;
            });

            appContent.innerHTML = `
                <div class="w-full pb-4">
                    <!-- Result Header -->
                    <div class="text-center mb-8">
                        <p class="text-indigo-600 font-bold text-sm uppercase tracking-wider mb-2">${matchResultStr}</p>
                        <h2 class="text-4xl md:text-5xl font-black text-gray-900 mb-6 text-gradient drop-shadow-sm">
                            ${destNameStr}
                        </h2>
                        <div class="w-full h-48 md:h-72 rounded-3xl overflow-hidden shadow-lg border-4 border-white">
                            <img src="${destImgUrl}" class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-700" alt="Destination">
                        </div>
                    </div>
                    
                    <!-- Vibe Planner Injection -->
                    ${itineraryHtml}

                    <!-- Transition Text -->
                    <div class="text-center my-10">
                        <p class="text-lg md:text-xl font-extrabold text-indigo-900 bg-white/80 inline-block px-6 py-3.5 rounded-2xl shadow-sm border border-indigo-100 backdrop-blur-md">
                            ${transitionTextStr}
                        </p>
                    </div>

                    <!-- Products Section -->
                    <div class="mb-10">
                        <h3 class="text-xl font-extrabold text-gray-800 mb-5 flex items-center gap-2">
                            🛍️ ${recommendedProductsStr}
                        </h3>
                        <div class="space-y-4">
                            ${productsHtml}
                        </div>
                    </div>

                    <!-- Callout Box -->
                    <div class="bg-gradient-to-r from-pink-50 to-indigo-50 border border-indigo-100 rounded-2xl p-5 mb-8 text-center shadow-sm">
                        <p class="font-bold text-indigo-800 text-[15px]">
                            ${calloutStr}
                        </p>
                    </div>

                    <!-- Actions -->
                    <div class="text-center">
                        <button onclick="restartQuiz()" class="text-gray-500 font-bold hover:text-indigo-600 transition-colors flex items-center justify-center gap-2 mx-auto">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                            </svg>
                            ${retakeBtnStr}
                        </button>
                    </div>
                </div>
            `;

            // Initialize map for the destination
            setTimeout(() => {
                initItineraryMap(lang);
            }, 50);
        }

        function initItineraryMap(langState) {
            if (itineraryMap) {
                try { itineraryMap.remove(); } catch (e) { }
                itineraryMap = null;
            }

            const resData = resultsData[finalResultId];
            if (!resData) return;

            const targetCenter = resData.coordinates;
            const targetZoom = resData.zoom;

            // Start from global view to show smooth flyTo transition on first load
            if (isFirstMapLoad) {
                itineraryMap = L.map('itinerary-map', { zoomControl: false }).setView([20, 0], 2);
            } else {
                itineraryMap = L.map('itinerary-map', { zoomControl: false }).setView(targetCenter, targetZoom);
            }

            L.control.zoom({ position: 'topright' }).addTo(itineraryMap);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(itineraryMap);

            const markerGroup = L.featureGroup().addTo(itineraryMap);
            markersMap = {};

            // Custom bouncing main destination icon
            const destIcon = L.divIcon({
                className: 'custom-dest-icon',
                html: `
                    <div style="background-color: #ec4899; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 18px; animation: bounce 1s infinite alternate;">
                        📍
                    </div>
                `,
                iconSize: [36, 36],
                iconAnchor: [18, 36],
                popupAnchor: [0, -36]
            });

            // Bilingual popup content
            const activeDestName = resData.dest[langState];
            const altLang = langState === 'zh' ? 'ko' : 'zh';
            const altDestName = resData.dest[altLang];
            const popupContent = `
                <div class="text-center p-1 min-w-[150px]">
                    <div class="text-[10px] uppercase tracking-wider text-indigo-500 font-bold mb-1">
                        ${langState === 'zh' ? '推荐目的地' : '추천 여행지'}
                    </div>
                    <div class="font-black text-gray-900 text-base mb-0.5">${activeDestName}</div>
                    <div class="text-[11px] text-gray-400 font-medium">${altDestName}</div>
                </div>
            `;

            const mainMarker = L.marker(targetCenter, { icon: destIcon })
                .bindPopup(popupContent, { offset: [0, -5], closeOnClick: false, autoClose: false })
                .addTo(markerGroup);

            markersMap['main'] = mainMarker;

            const listContainer = document.getElementById('itinerary-list');
            if (listContainer) {
                listContainer.innerHTML = '';
            }

            if (resData.isOsaka) {
                const createCustomIcon = (dayNum) => {
                    return L.divIcon({
                        className: 'custom-day-icon',
                        html: `
                            <div style="background-color: #4f46e5; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 13px;">
                                ${dayNum}
                            </div>
                        `,
                        iconSize: [28, 28],
                        iconAnchor: [14, 28],
                        popupAnchor: [0, -28]
                    });
                };

                osakaItineraryData.forEach(dayInfo => {
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'sticky top-0 z-10 pt-1 pb-2 bg-gray-50/95 backdrop-blur-sm';
                    const currentTitle = dayInfo.title[langState];
                    dayHeader.innerHTML = `
                        <div class="inline-flex items-center px-3 py-1.5 bg-white rounded-full shadow-sm border border-indigo-100">
                            <span class="bg-indigo-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full mr-2">Day ${dayInfo.day}</span>
                            <span class="text-gray-800 font-bold text-xs">${currentTitle}</span>
                        </div>
                    `;
                    listContainer.appendChild(dayHeader);

                    dayInfo.spots.forEach(spot => {
                        const currentName = spot.name[langState];
                        const currentDesc = spot.desc[langState];

                        const card = document.createElement('div');
                        card.className = "bg-white rounded-xl shadow-sm p-3 mb-3 cursor-pointer border-l-4 border-transparent hover:border-indigo-500 hover:shadow-md transition-all group relative overflow-hidden";
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-1 relative z-10">
                                <h3 class="font-bold text-sm text-gray-800 group-hover:text-indigo-600 transition-colors">${currentName}</h3>
                                <span class="text-indigo-500 text-[10px] font-bold whitespace-nowrap bg-indigo-50 px-1.5 py-0.5 rounded">${spot.time}</span>
                            </div>
                            <p class="text-gray-500 text-[11px] leading-relaxed relative z-10">${currentDesc}</p>
                        `;

                        card.onclick = () => {
                            const targetMarker = markersMap[spot.id];
                            if (targetMarker) {
                                itineraryMap.flyTo(targetMarker.getLatLng(), 15, { duration: 1.2 });
                                itineraryMap.once('moveend', () => {
                                    targetMarker.openPopup();
                                });
                            }
                        };
                        listContainer.appendChild(card);

                        const spotPopupContent = `
                            <div style="text-align: center; font-family: sans-serif; width: 160px;">
                                <img src="${spot.image}" width="160" height="100" style="object-fit: cover; border-radius: 6px; margin-bottom: 6px;" onload="this.closest('.leaflet-popup') && this.closest('.leaflet-popup')._initLayout && this.closest('.leaflet-popup').update();">
                                <div style="font-weight: bold; font-size: 13px; color: #333;">${currentName}</div>
                            </div>
                        `;

                        const marker = L.marker([spot.lat, spot.lng], { icon: createCustomIcon(dayInfo.day) })
                            .bindPopup(spotPopupContent, { offset: [0, -5] })
                            .addTo(markerGroup);

                        markersMap[spot.id] = marker;
                    });
                });
            } else if (resData.spots) {
                const createCustomSpotIcon = (num) => {
                    return L.divIcon({
                        className: 'custom-spot-icon',
                        html: `
                            <div style="background-color: #4f46e5; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 13px;">
                                ${num}
                            </div>
                        `,
                        iconSize: [28, 28],
                        iconAnchor: [14, 28],
                        popupAnchor: [0, -28]
                    });
                };

                const header = document.createElement('div');
                header.className = 'sticky top-0 z-10 pt-1 pb-2 bg-gray-50/95 backdrop-blur-sm';
                header.innerHTML = `
                    <div class="inline-flex items-center px-3 py-1.5 bg-white rounded-full shadow-sm border border-indigo-100">
                        <span class="bg-indigo-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full mr-2">📍</span>
                        <span class="text-gray-800 font-bold text-xs">${langState === 'zh' ? '首尔热门地标' : '서울 인기 랜드마크'}</span>
                    </div>
                `;
                listContainer.appendChild(header);

                resData.spots.forEach((spot, index) => {
                    const currentName = spot.name[langState];
                    const spotId = `seoul-spot-${index}`;

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-sm p-3 mb-3 cursor-pointer border-l-4 border-transparent hover:border-indigo-500 hover:shadow-md transition-all group relative overflow-hidden";
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-1 relative z-10">
                            <h3 class="font-bold text-sm text-gray-800 group-hover:text-indigo-600 transition-colors">${currentName}</h3>
                            <span class="text-indigo-500 text-[10px] font-bold whitespace-nowrap bg-indigo-50 px-1.5 py-0.5 rounded">#${index + 1}</span>
                        </div>
                    `;

                    card.onclick = () => {
                        const targetMarker = markersMap[spotId];
                        if (targetMarker) {
                            itineraryMap.flyTo(targetMarker.getLatLng(), 15, { duration: 1.2 });
                            itineraryMap.once('moveend', () => {
                                targetMarker.openPopup();
                            });
                        }
                    };
                    listContainer.appendChild(card);

                    const altLang = langState === 'zh' ? 'ko' : 'zh';
                    const altName = spot.name[altLang];
                    const spotPopupContent = `
                        <div style="text-align: center; font-family: sans-serif; width: 160px;">
                            <img src="${spot.image}" width="160" height="100" style="object-fit: cover; border-radius: 6px; margin-bottom: 6px;" onload="this.closest('.leaflet-popup') && this.closest('.leaflet-popup')._initLayout && this.closest('.leaflet-popup').update();">
                            <div style="font-weight: bold; font-size: 13px; color: #333;">${currentName}</div>
                        </div>
                    `;

                    const marker = L.marker(spot.coord, { icon: createCustomSpotIcon(index + 1) })
                        .bindPopup(spotPopupContent, { offset: [0, -5] })
                        .addTo(markerGroup);

                    markersMap[spotId] = marker;
                });
            } else {
                if (resData.routePlan) {
                    resData.routePlan.forEach(rp => {
                        const rpDesc = rp[langState];

                        const card = document.createElement('div');
                        card.className = "bg-white rounded-xl shadow-sm p-4 mb-3 cursor-pointer border-l-4 border-transparent hover:border-indigo-500 hover:shadow-md transition-all group relative overflow-hidden";
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-2 relative z-10">
                                <span class="bg-indigo-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">Day ${rp.day}</span>
                            </div>
                            <p class="text-gray-700 text-[12px] font-semibold leading-relaxed relative z-10">${rpDesc}</p>
                        `;

                        card.onclick = () => {
                            itineraryMap.flyTo(targetCenter, targetZoom, { duration: 1.2 });
                            itineraryMap.once('moveend', () => {
                                mainMarker.openPopup();
                            });
                        };
                        listContainer.appendChild(card);
                    });
                }
            }

            if (isFirstMapLoad) {
                setTimeout(() => {
                    itineraryMap.flyTo(targetCenter, targetZoom, { duration: 2.0, easeLinearity: 0.25 });
                    itineraryMap.once('moveend', () => {
                        mainMarker.openPopup();
                    });
                }, 100);
                isFirstMapLoad = false;
            } else {
                mainMarker.openPopup();
            }
        }

        // --- INIT ---
        window.onload = () => {
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('ko')) {
                setLanguage('ko');
            } else {
                setLanguage('zh');
            }

            setTimeout(() => {
                appContent.classList.add('show');
            }, 100);
        };
    </script>
</body>

</html>
